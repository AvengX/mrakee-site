# Build check only.
#
# This replaced a "Deploy to GitHub Pages" workflow that failed on every
# single push, for two reasons worth recording so nobody restores it:
#
#   1. It failed at actions/configure-pages, because Pages has never been
#      enabled for this repo. That is the failure that was emailing on
#      every push.
#
#   2. Enabling Pages would have been WORSE than leaving it broken. This
#      site is deployed by Vercel, and api/chat.js and api/tts.js are
#      serverless functions. GitHub Pages serves static files only, so a
#      Pages deployment would have been a public copy of the site with a
#      completely dead assistant — the microphone, Claude and the voice
#      all failing on a URL nobody was watching.
#
# What is left is the half that was doing real work: the build ran green
# on every push and would have caught a break before Vercel did. It is
# silent when it passes, so it does not email.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx oxlint src/
      - run: npm run build
