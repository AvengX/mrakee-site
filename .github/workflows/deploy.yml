name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy-pages action needs
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # NOTE: no `enablement: true` here. The default GITHUB_TOKEN cannot
      # switch Pages on for a repo that has never had it configured, and the
      # step hard-fails when it tries. Pages must be set to the "GitHub
      # Actions" source once in Settings -> Pages; after that this works.
      - uses: actions/configure-pages@v5

      # vite.config.js sets base:'./' so the build already works from the
      # /<repo>/ subpath a project Pages site is served from.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
