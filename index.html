<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The real mark, not the hand-drawn SVG approximation that stood in
         for it. PNG because the artwork is a metallic gradient with an
         alpha edge, which is not something an inline SVG reproduces. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The site is light by design. Declaring it stops the browser from
         applying its own dark form controls and scrollbars over the top. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="MRAKEE Technologies — systems integration. Design, integration and support for meeting rooms, learning spaces, command centres, digital signage and large venues."
    />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews. Without og:image a shared link renders as a bare
         line of text on WhatsApp, LinkedIn and X — which is where a B2B
         site actually gets passed around, so the mark was absent from
         the one place it does the most work. 1200x630 is the size all
         four of those crop from. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MRAKEE Technologies" />
    <meta property="og:title" content="MRAKEE Technologies — Systems Integration" />
    <meta
      property="og:description"
      content="Design, integration and support for meeting rooms, learning spaces, command centres, digital signage and large venues."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MRAKEE Technologies" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MRAKEE Technologies — Systems Integration" />
    <meta name="twitter:image" content="/og.png" />

    <title>MRAKEE Technologies — Systems Integration</title>

    <!-- Outfit, for the assistant dock only. The site's own type is
         unchanged: every other component names Inter, so nothing outside
         the dock re-renders because this exists. It is here rather than
         bundled because it is one face used by one component, and
         display=swap keeps it off the critical path. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
