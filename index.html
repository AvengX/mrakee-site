<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The real mark, not the hand-drawn SVG approximation that stood in
         for it. PNG because the artwork is a metallic gradient with an
         alpha edge, which is not something an inline SVG reproduces. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The site is light by design. Declaring it stops the browser from
         applying its own dark form controls and scrollbars over the top. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <title>MRakee Technologies | AI Solutions, Digital Signage &amp; Smart Kiosks</title>
    <meta
      name="description"
      content="MRakee Technologies delivers enterprise AI solutions, smart digital signage, and AI-powered kiosks. We design, integrate, and scale custom technology solutions."
    />
    <link rel="canonical" href="https://mrakeetechnologies.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta http-equiv="content-language" content="en" />
    <meta name="google-site-verification" content="google79648f60235aec18" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MRakee Technologies" />
    <meta property="og:title" content="MRakee Technologies | AI Solutions, Digital Signage &amp; Smart Kiosks" />

      property="og:description"
      content="MRakee Technologies delivers enterprise AI solutions, smart digital signage, and AI-powered kiosks. We design, integrate, and scale custom technology solutions."
    />
    <meta property="og:url" content="https://mrakeetechnologies.com/" />
    <meta property="og:image" content="https://mrakeetechnologies.com/og.png" />

    <meta property="og:image:width" content="1200" />

    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="MRakee Technologies — AI Solutions, Digital Signage &amp; Smart Kiosks" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MRakee Technologies | AI Solutions, Digital Signage &amp; Smart Kiosks" />
    <meta
      name="twitter:description"
      content="MRakee Technologies delivers enterprise AI solutions, smart digital signage, and AI-powered kiosks. We design, integrate, and scale custom technology solutions."

    <meta name="twitter:image" content="https://mrakeetechnologies.com/og.png" />
    <meta name="twitter:image:alt" content="MRakee Technologies — AI Solutions, Digital Signage &amp; Smart Kiosks" />

          "@type": "Organization",
          "@id": "https://mrakeetechnologies.com/#organization",

          "logo": {
            "@type": "ImageObject",
            "@id": "https://mrakeetechnologies.com/#logo",
            "url": "https://mrakeetechnologies.com/logo-full.png",

          "description": "MRakee Technologies delivers enterprise AI solutions, smart digital signage, and AI-powered kiosks. We design, integrate, and scale custom technology solutions.",

    <!-- Outfit, for the assistant dock only. The site's own type is
         unchanged: every other component names Inter, so nothing outside
         the dock re-renders because this exists. It is here rather than
         bundled because it is one face used by one component, and
         display=swap keeps it off the critical path. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap"
    />
