<title>MRAKEE Concierge</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ============================================================
   MRAKEE CONCIERGE — kiosk screen UI, 1080 x 1920 portrait.

   This is the SCREEN only. The physical kiosk is untouched; the
   stage below is the exact panel size the existing hardware runs,
   scaled to fit whatever is looking at it.

   PALETTE, and the one rule that shapes it: Premium Gold scores
   2.14:1 on Off White and 2.61:1 on Deep Teal. It cannot carry
   text at any size, so it appears here only as fills — a rule, a
   status dot, the ring on a chosen tile. Deep Teal at 5.60:1 does
   the talking. That constraint is why the interface reads as
   teal-with-gold rather than gold-first.
   ============================================================ */

:root {
  --ground:      #F7F8F6;   /* Off White — the screen itself     */
  --surface:     #FFFFFF;   /* glass panels over the ground      */
  --teal:        #006F73;   /* Deep Teal — primary, 5.60:1       */
  --teal-lift:   #00A0A0;   /* highlights and glow only          */
  --gold:        #D8A32A;   /* accent FILLS only, never text     */
  --ink:         #0B1F2A;   /* Executive Dark, 15.85:1           */
  --ink-soft:    #55666C;   /* teal-biased grey, 5.63:1          */
  --hairline:    rgba(11, 31, 42, 0.09);
  --hairline-on: rgba(0, 111, 115, 0.42);

  /* The page around the screen. Only this adapts to the viewer's
     theme — the kiosk panel is a physical device and stays lit
     the same way in a dark room. */
  --page:        #E7EAE6;
  --page-ink:    #55666C;

  --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #10171A; --page-ink: #7E9096; }
}
:root[data-theme="dark"] { --page: #10171A; --page-ink: #7E9096; }

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--page);
  color: var(--page-ink);
  font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, sans-serif;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  overflow: hidden;
}

/* ---- the scaler ------------------------------------------------
   The stage is authored at true device pixels and scaled as one
   piece, so every measurement in this file is the measurement the
   kiosk actually renders. Nothing reflows between here and the
   hardware. */
.fit { display: grid; place-items: center; }

.screen {
  width: 1080px;
  height: 1920px;
  transform-origin: top left;
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 72px 64px 64px;
  gap: 0;
  background: var(--ground);
  border-radius: 34px;
  box-shadow: 0 40px 90px rgba(11, 31, 42, 0.22), 0 2px 0 rgba(255,255,255,0.6) inset;
  overflow: hidden;
}

/* One very quiet wash so the panel has depth without a gradient
   anyone would call a gradient. 5% teal, top right, nothing else. */
.screen::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(760px 620px at 88% -6%, rgba(0, 160, 160, 0.10), transparent 68%),
    radial-gradient(620px 520px at 4% 102%, rgba(0, 111, 115, 0.055), transparent 70%);
  pointer-events: none;
}
.screen > * { position: relative; }

/* ---- header ---- */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  flex: none;
}
.mark { height: 44px; width: auto; display: block; }

.clock {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  font-size: 27px;
  letter-spacing: 0.01em;
  color: var(--ink);
}
.clock small {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

/* ---- the ask ---- */
.hero { flex: none; padding: 88px 0 0; }
.hero h1 {
  margin: 0;
  font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
  font-weight: 500;
  font-size: 84px;
  line-height: 1.02;
  letter-spacing: -0.028em;
  color: var(--ink);
  text-wrap: balance;
}
.hero p {
  margin: 22px 0 0;
  font-size: 33px;
  font-weight: 500;
  line-height: 1.35;
  color: var(--ink-soft);
}
/* The single gold rule on the screen. It marks where the question
   ends and the answers begin, which is the one hierarchy break
   worth marking. */
.rule {
  width: 92px;
  height: 5px;
  border-radius: 3px;
  background: var(--gold);
  margin: 34px 0 0;
  flex: none;
}

/* ---- services -------------------------------------------------
   Four weights, not four copies. Two peers of equal standing, one
   primary the whole screen leans toward, one quiet closer. The
   varying weight IS the hierarchy — nothing here is a card grid
   with different labels in it. */
.services { display: flex; flex-direction: column; gap: 34px; padding: 70px 0 0; flex: none; }
.peers { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }

.svc {
  -webkit-appearance: none;
  appearance: none;
  font: inherit;
  text-align: left;
  cursor: pointer;
  position: relative;
  border-radius: 30px;
  border: 1px solid var(--hairline);
  background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.72));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 1px 2px rgba(11,31,42,0.04), 0 12px 28px rgba(11,31,42,0.05);
  transition: transform 240ms var(--ease), box-shadow 240ms var(--ease),
              border-color 240ms var(--ease), background 240ms var(--ease);
  overflow: hidden;
}
.svc:focus-visible { outline: 3px solid var(--teal); outline-offset: 4px; }

.svc .ico { color: var(--teal); transition: transform 300ms var(--ease); }
.svc .name {
  font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: -0.012em;
}
.svc .desc { color: var(--ink-soft); font-weight: 500; }

/* Selection ring: teal, and a gold pip that only exists once a
   choice has been made. */
.svc::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  border: 2px solid var(--ring, transparent);
  box-shadow: 0 0 0 6px var(--ring-glow, transparent);
  transition: border-color 240ms var(--ease), box-shadow 240ms var(--ease);
  pointer-events: none;
}
.svc:hover { transform: translateY(-3px); border-color: var(--hairline-on);
             box-shadow: 0 2px 4px rgba(11,31,42,0.05), 0 20px 42px rgba(0,111,115,0.10); }
.svc:hover .ico { transform: translateY(-3px); }
.svc:active { transform: translateY(-1px) scale(0.995); }
.svc.is-on { --ring: var(--teal); --ring-glow: rgba(0, 111, 115, 0.10); }
.svc.is-on .pip { opacity: 1; transform: scale(1); }

.pip {
  position: absolute;
  top: 26px; right: 26px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--gold);
  opacity: 0;
  transform: scale(0.4);
  transition: opacity 240ms var(--ease), transform 240ms var(--ease);
}

/* peers — the two tall ones */
.svc--peer {
  height: 340px;
  padding: 44px 40px 40px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0;
}
.svc--peer .ico { margin-bottom: auto; }
.svc--peer .name { font-size: 42px; margin: 0 0 12px; }
.svc--peer .desc { font-size: 28px; }

/* primary — the one the screen leans toward */
.svc--primary {
  height: 312px;
  padding: 0 52px;
  display: flex;
  align-items: center;
  gap: 40px;
  background: linear-gradient(160deg, #00787C 0%, var(--teal) 58%, #005F63 100%);
  border-color: transparent;
  box-shadow: 0 3px 8px rgba(0,111,115,0.18), 0 22px 48px rgba(0,111,115,0.22);
}
.svc--primary .ico { color: var(--ground); }
.svc--primary .name { color: var(--ground); font-size: 50px; margin: 0 0 12px; }
.svc--primary .desc { color: rgba(247,248,246,0.88); font-size: 30px; }  /* 4.7:1 */
.svc--primary:hover { box-shadow: 0 3px 8px rgba(0,111,115,0.20), 0 30px 60px rgba(0,111,115,0.30); }
.svc--primary.is-on { --ring: var(--gold); --ring-glow: rgba(216, 163, 42, 0.22); }
.svc--primary .pip { background: var(--ground); }
.orb {
  flex: none;
  width: 108px; height: 108px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(247,248,246,0.14);
  border: 1px solid rgba(247,248,246,0.26);
}

/* tertiary — quiet, and horizontal so it reads as a footer action */
.svc--quiet {
  height: 180px;
  padding: 0 44px;
  display: flex;
  align-items: center;
  gap: 30px;
  background: transparent;
  box-shadow: none;
  border-color: var(--hairline);
}
.svc--quiet:hover { background: rgba(255,255,255,0.62); }
.svc--quiet .name { font-size: 38px; margin: 0 0 6px; }
.svc--quiet .desc { font-size: 27px; }
.svc--quiet .go { margin-left: auto; color: var(--teal); opacity: 0.5; transition: opacity 240ms var(--ease), transform 240ms var(--ease); }
.svc--quiet:hover .go { opacity: 1; transform: translateX(5px); }

/* ---- the concierge --------------------------------------------
   Not a badge in a corner. A full-width surface she occupies, so
   the assistant reads as present on the screen rather than stuck
   onto it. */
.concierge {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 30px;
  padding: 62px 46px;
  border-radius: 34px;
  border: 1px solid var(--hairline);
  background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.66));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 14px 34px rgba(11,31,42,0.05);
  flex: none;
}
.face { position: relative; flex: none; width: 152px; height: 152px; }
/* Her own ground is #F3F6F2, within four points of the screen's
   Off White, so a circular crop sits on the panel instead of
   floating on a disc. The glow does the separating. */
.face img {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  position: relative;
  z-index: 1;
  border: 3px solid rgba(255,255,255,0.9);
}
.face::before {
  content: "";
  position: absolute;
  inset: -14px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, rgba(0,160,160,0.30), rgba(0,160,160,0) 70%);
  animation: breathe 5.5s ease-in-out infinite;
}
.face::after {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 2px solid rgba(0,111,115,0.30);
  z-index: 2;
}
@keyframes breathe {
  0%, 100% { transform: scale(1);    opacity: 0.85; }
  50%      { transform: scale(1.06); opacity: 1; }
}

.says { min-width: 0; }
.says h2 {
  margin: 0 0 10px;
  font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
  font-weight: 500;
  font-size: 35px;
  letter-spacing: -0.014em;
  white-space: nowrap;
  color: var(--ink);
}
.says p { margin: 0; font-size: 27px; font-weight: 500; line-height: 1.4; color: var(--ink-soft); }

.live {
  margin-left: auto;
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 22px;
  border-radius: 999px;
  background: rgba(0,111,115,0.08);
  border: 1px solid rgba(0,111,115,0.18);
  color: var(--teal);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.live i { width: 12px; height: 12px; border-radius: 50%; background: var(--teal); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }

/* ---- utility row ---- */
.utils { display: flex; gap: 18px; padding-top: 26px; flex: none; }
.util {
  -webkit-appearance: none; appearance: none; font: inherit; cursor: pointer;
  display: inline-flex; align-items: center; gap: 12px;
  padding: 18px 30px;
  border-radius: 999px;
  border: 1px solid var(--hairline);
  background: transparent;
  color: var(--ink-soft);
  font-size: 25px;
  font-weight: 600;
  transition: border-color 220ms var(--ease), color 220ms var(--ease), background 220ms var(--ease);
}
.util:hover { border-color: var(--hairline-on); color: var(--teal); background: rgba(255,255,255,0.6); }
.util:focus-visible { outline: 3px solid var(--teal); outline-offset: 4px; }
.util svg { color: currentColor; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }
  .svc:hover { transform: none; }
}
</style>

<script>
/* Scale the whole 1080x1920 panel as one piece. Authoring at device
   pixels means every size in the stylesheet is the size the kiosk
   renders — nothing reflows between this file and the hardware. */
const screenEl = document.getElementById("screen");
const fit = document.querySelector(".fit");
function scale() {
  const s = Math.min((innerWidth - 40) / 1080, (innerHeight - 40) / 1920);
  screenEl.style.transform = "scale(" + s + ")";
  fit.style.width = 1080 * s + "px";
  fit.style.height = 1920 * s + "px";
}
/* The first call can run before the viewport has settled, which leaves
   the panel scaled to stale dimensions and sitting off-centre. Rescale
   on resize, once the webfonts land, and on the next two frames.
   Deliberately NOT a ResizeObserver on the document: scale() sets the
   size of an element inside that document, so observing it is a
   feedback loop — in a host that sizes its viewport to the content it
   settles at 1.0 and pushes the panel past the edges. */
addEventListener("resize", scale);
if (document.fonts) document.fonts.ready.then(scale);
requestAnimationFrame(() => { scale(); requestAnimationFrame(scale); });
scale();

/* One choice at a time, which is what a kiosk actually enforces. */
const tiles = [...document.querySelectorAll(".svc")];
tiles.forEach((t) => t.addEventListener("click", () => {
  const on = t.classList.contains("is-on");
  tiles.forEach((o) => o.classList.remove("is-on"));
  if (!on) t.classList.add("is-on");
}));

/* Real time, not a mocked-up label. */
const time = document.getElementById("time");
const zone = document.getElementById("zone");
function tick() {
  const d = new Date();
  time.textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  zone.textContent = d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
}
tick();
setInterval(tick, 10000);
</script>
